[package]
name = "pixlova-contracts"
version = "0.1.0"
description = "Contrats pixlova côté Rust : JSON strict, JCS, signatures Ed25519, validation des schémas et règles d’acceptation."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
jsonschema = { version = "0.58.2", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10.9"

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
