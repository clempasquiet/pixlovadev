[package]
name = "pixlova-renderer"
version = "0.1.0"
description = "Renderer natif pixlova : WebView système (WebKitGTK, WebView2) hébergeant la page de lecture et le moteur de rendu partagé, sans secret."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pixlova-contracts = { path = "../contracts" }
base64 = "0.22.1"
serde_json = "1.0.149"
sha2 = "0.10.9"
tao = "0.37.1"
wry = "0.57.0"

# Capture de la vue (SUP-004) : mêmes versions que celles de wry.
[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.18.5", features = ["png"] }
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
