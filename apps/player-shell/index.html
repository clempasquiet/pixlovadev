<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' pixlova: http://pixlova.asset data:; media-src 'self' pixlova: http://pixlova.asset; connect-src 'none'"
    />
    <title>pixlova</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        cursor: none;
      }
      #surface {
        position: fixed;
        inset: 0;
      }
      #notice {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2vh;
        background: #101820;
        color: #e8eef2;
        font-family: 'Inter Variable', system-ui, sans-serif;
        text-align: center;
      }
      #notice[hidden] {
        display: none;
      }
      #notice .title {
        font-size: 4vh;
        opacity: 0.8;
      }
      #notice .code {
        font-size: 14vh;
        font-weight: 700;
        letter-spacing: 0.08em;
        font-variant-numeric: tabular-nums;
      }
      #notice .hint {
        font-size: 2.6vh;
        opacity: 0.7;
        max-width: 70vw;
      }
    </style>
  </head>
  <body>
    <div id="surface"></div>
    <div id="notice" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
